# Local test only: MySQL in a container replaces RDS.
# Usage: docker compose up --build   then open http://127.0.0.1:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: localpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocalpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: localpass
      DB_NAME: school
    ports:
      - "3500:3500"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The React app runs in YOUR browser, so it calls the backend via localhost
        REACT_APP_API_BASE_URL: http://localhost:3500
    ports:
      - "8080:80"
    depends_on:
      - backend